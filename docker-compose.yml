services:
  postgres:
    image: postgres:15-alpine
    container_name: brightloop-postgres
    restart: always
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_password
      POSTGRES_DB: brightloop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
